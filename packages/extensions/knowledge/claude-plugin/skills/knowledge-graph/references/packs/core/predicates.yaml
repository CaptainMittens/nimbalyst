# Knowledge graph predicate pack: core. Every project gets it.
#
# The verbs a graph is allowed to use, stored as claims (dated, cited, with
# history). This is the claim half of the vocabulary; field-stored properties
# and labels are in `labels.yaml` next to this file. A relation is a named
# predicate with an inverse label and nothing more: what connects two pages is
# said in the prose of the page that links them, not in fields on the edge.
#
# Every subject is declared against `entity`: what a page is lives in its
# labels, so a new label satisfies these with no edit here. The knowledge-setup
# skill merges this file by id and never overwrites an existing predicate.
predicates:
  - id: integrates-with
    label: integrates with
    inverseLabel: is integrated by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    transitive: false

  - id: implements-protocol
    label: implements
    inverseLabel: is implemented by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: provided-by
    label: is provided by
    inverseLabel: provides
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: component-of
    label: is a component of
    inverseLabel: has component
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    transitive: true

  - id: requires
    label: requires
    inverseLabel: is required by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: imports-format
    label: imports
    inverseLabel: is imported by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: exports-format
    label: exports
    inverseLabel: is exported by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  # `boolean-assessment`, not `boolean`, on purpose: support has to be able to
  # say "partial" and "unknown". Collapsing those to false is how a documented
  # gap becomes a recorded denial.
  - id: supports-capability
    label: supports
    inverseLabel: is supported by
    subjectKinds: [entity]
    valueShape: boolean-assessment
    direction: directed

  - id: inspired-by
    label: is inspired by
    inverseLabel: inspired
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: depends-on
    label: depends on
    inverseLabel: is depended on by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
