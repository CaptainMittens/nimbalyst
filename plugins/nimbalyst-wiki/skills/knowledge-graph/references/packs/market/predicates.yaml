# Knowledge graph predicate pack: market (opt-in).
#
# Market, maker and competition relationships, and dated facts about
# organizations and products. Needs the core pack.
#
# "Competitor" is a relationship, not a location: the project competes with a
# product, and the market they compete in is that product's `in-market`.
predicates:
  - id: in-market
    label: is in market
    inverseLabel: includes
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: made-by
    label: is made by
    inverseLabel: makes
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: competes-with
    label: competes with
    inverseLabel: competes with
    subjectKinds: [entity]
    valueShape: entity
    direction: symmetric

  # --- Dated facts ----------------------------------------------------------
  #
  # A fact is a claim, not a field, because it changes and needs a date and a
  # source. The claim records `asOf` (`asOfPrecision` says whether it is a day,
  # month or year; a month is stored as its first day); the display value goes in
  # `claim.valueText`; quantity facts also carry `amount` and `unit` (USD,
  # people, users, seats); sources go in `claim.citations`. The current value is
  # the latest `asOf` among asserted claims. Organization facts: annual-revenue,
  # funding-total, valuation, last-round, headcount, founded, hq. Product facts:
  # pricing, license, platforms, launched, users, lifecycle.

  - id: annual-revenue
    label: annual revenue
    inverseLabel: annual revenue of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed

